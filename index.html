<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Episode 2: Rahasia Terlarang di Balik Lemari</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #070709;
            color: #e0e0e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 6px;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #111118;
            border-radius: 20px;
            border: 1px solid #20202e;
            box-shadow: 0 10px 35px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }
        .header {
            padding: 14px;
            background: #09090d;
            text-align: center;
            border-bottom: 1px solid #1a1a26;
        }
        .header h1 {
            font-size: 1rem;
            color: #ff477e;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header p {
            font-size: 0.72rem;
            color: #8a8a9e;
            margin-top: 3px;
        }
        .story-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .narrative {
            font-size: 0.95rem;
            line-height: 1.85;
            color: #d1d1e0;
            text-align: justify;
        }
        .dialogue {
            background: #181824;
            padding: 14px 16px;
            border-left: 3px solid #ff477e;
            border-radius: 0 12px 12px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffffff;
            font-style: italic;
        }
        .character-name {
            font-weight: bold;
            color: #ff7597;
            font-style: normal;
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .interactive-section {
            padding: 14px;
            background: #09090d;
            border-top: 1px solid #1a1a26;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            background: #1a1a26;
            color: #ff7597;
            border: 1px solid #ff477e;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .choice-btn:active {
            background: #ff477e;
            color: #ffffff;
        }
        .progress-bar {
            height: 4px;
            background: #1a1a26;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff477e, #ff0055);
            width: 10%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gelora Di Kamar Kost</h1>
        <p>Episode 2: Bisikan Terlarang & Bahaya</p>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
    
    <div class="story-body" id="storyBox">
        <!-- Konten cerita diisi oleh JavaScript -->
    </div>

    <div class="interactive-section" id="choiceBox">
        <!-- Tombol interaksi diisi oleh JavaScript -->
    </div>
</div>

<script>
const scenes = [
    {
        narrative: "Suara gedoran keras di pintu kayu itu membuyarkan puncak gairah kalian secara brutal. Matanya Clarissa membelalak lebar dalam kepanikan penuh; napasnya yang semula memburu pasrah kini berubah menjadi embusan hening yang kaku. Seluruh darah di wajahnya serasa tersedot habis. Di luar, suara langkah kaki berat dan derak gagang pintu yang diguncang paksa menandakan waktu kalian tak lebih dari beberapa detik sebelum seseorang membobol masuk.",
        dialogue: "Clarissa: 'Mati aku... Itu Rian, mantan pacarku yang makin posesif! Kamu harus sembunyi sekarang juga! cepat!'",
        choices: [
            { text: "Segera menyambar kemejamu dan bersembunyi di dalam lemari", nextScene: 1 },
            { text: "Menarik Clarissa dan bersembunyi di celah sempit samping lemari pakaian", nextScene: 1 }
        ]
    },
    {
        narrative: "Kamu melompat cepat tanpa busana dada, menyambar kemejamu dan masuk ke dalam celah sempit di balik lemari kayu pakaian yang membentang di sudut kamar. Hanya hitungan detik setelah kamu menyatu dengan kegelapan celah itu, pintu kamar kost dihentakkan terbuka dari luar. Rian melangkah masuk dengan napas memburu, matanya menyapu sekeliling kamar yang berantakan dengan sprei kusut dan hawa panas yang mencurigakan.",
        dialogue: "Rian: 'Kenapa lama banget buka pintu?! Kamu sama siapa di dalam hah?! Kenapa kasur kamu acak-acakan begini?!'",
        choices: [
            { text: "Menahan napas dan mengintip lewat celah kayu", nextScene: 2 },
            { text: "Bersiap keluar jika Rian mulai kasar pada Clarissa", nextScene: 2 }
        ]
    },
    {
        narrative: "Dari dalam celah sempit berdebu itu, pandanganmu mengunci tubuh Clarissa. Ia berdiri dengan bahu bergetar halus, mencoba merapikan camisole tipisnya yang melorot dengan jemari gemetar. Rian mendekat secara intimidatif, mencengkeram lengan Clarissa hingga gadis itu meringis pelan. Namun, yang Rian tidak tahu adalah dari sudut tempatmu bersembunyi, posisi Clarissa persis berdiri membelakanginya dan berhadapan langsung dengan celah sembunyimu.",
        dialogue: "Clarissa: 'Lepasin, Rian! Kita udah putus! Aku cuma lagi tidur siang dan kepanasan, makanya agak lama buka pintu!'",
        choices: [
            { text: "Meraih pergelangan kaki Clarissa dari dalam kegelapan", nextScene: 3 },
            { text: "Mengusap betis mulusnya perlahan untuk menangkannya", nextScene: 3 }
        ]
    },
    {
        narrative: "Di bawah tekanan bahaya yang mengintai hanya sejarak beberapa sentimeter, kejutan sensual yang tidak masuk akal justru kembali menyengat. Tanganmu yang merayap di balik kegelapan meraih betis mulus Clarissa yang berdiri menempel di tepi lemari. Sentuhan mendadak di kulit kakinya membuat tubuh Clarissa tegang seketika. Matanya membelalak menatap ke arah celah tempatmu bersembunyi, namun ia terpaksa menahan jeritan atau reaksi apa pun agar Rian tidak curiga.",
        dialogue: "Rian: 'Tidur siang?! Kamu jangan bohong ya! Bau kamar ini beda, kayak ada wangi parfum cowok dan bau keringat!'",
        choices: [
            { text: "Perlahan merayapkan jemarimu naik menyusuri paha dalamnya", nextScene: 4 },
            { text: "Mempererat pegangan di kakinya sambil menatap matanya yang panik", nextScene: 4 }
        ]
    },
    {
        narrative: "Sensasi terlarang ini membakar adrenalin hingga ke tingkat yang membahayakan. Ketika Rian sibuk mengacak-acak area meja belajar Clarissa untuk mencari keberadaan pria lain, jemarimu justru makin berani merayap naik menyusuri paha dalam Clarissa dari balik celah. Tubuh Clarissa gemetaran hebat—bukan lagi semata karena takut pada mantan pacarnya, melainkan karena desiran gairah liar yang mendadak menyerangnya di tengah situasi berbahaya ini.",
        dialogue: "Clarissa: 'Ngg... Rian, keluar sekarang... Aku nggak ada sembunyiin siapa-siapa... emmh...'",
        choices: [
            { text: "Menggigit bibir bawahmu melihat reaksi tahanan napas Clarissa", nextScene: 5 },
            { text: "Sengaja menekan jemarimu lebih tinggi di balik celana pendeknya", nextScene: 5 }
        ]
    },
    {
        narrative: "Suara desahan terkejut yang berusaha setengah mati ditahan oleh Clarissa membuat Rian berbalik curiga. Clarissa dengan cepat menggigit bibir bawahnya rapat-rapat sampai memerah, meremas kain camisole di dadanya yang kembang-kempis cepat. Paha mulusnya di balik kegelapan kini bergetar hebat saat jemarimu menyentuh area paling sensitifnya secara sembunyi-sembunyi di bawah ancaman tertangkap basah.",
        dialogue: "Rian: 'Suara apa itu tadi, Clav? Kenapa muka kamu merah banget dan napas kamu kayak orang ketakutan begitu?'",
        choices: [
            { text: "Clarissa menyandarkan pinggulnya lebih rapat ke arah celahmu", nextScene: 6 },
            { text: "Clarissa berpura-pura marah untuk mengalihkan perhatian", nextScene: 6 }
        ]
    },
    {
        narrative: "Bukannya menarik diri karena takut, Clarissa dalam kepasrahan gairah rahasianya justru sengaja memundurkan pinggulnya makin merapat ke celah lemari. Sensasi sentuhan jemarimu di bawah ancaman ketahuan ini justru memberi sengatan nikmat yang berlipat ganda. Napasnya kian pendek, matanya sayu berair menatapmu di balik kegelapan celah kayu sempit itu.",
        dialogue: "Clarissa: 'Aku... aku cuma agak pusing karena kamu membentak-bentak aku terus! Keluar, Rian, sebelum aku teriak panggil panggil bapak kost!'",
        choices: [
            { text: "Menarik lembut pakaian bawahnya dari celah", nextScene: 7 },
            { text: "Memberikan sentuhan halus yang makin mempercepat napasnya", nextScene: 7 }
        ]
    },
    {
        narrative: "Rian yang mulai gentar mendengar ancaman panggil bapak kost akhirnya mundur beberapa langkah menuju pintu, namun pandangannya masih liar memindai sudut kamar. Di saat yang bersamaan, sentuhan jemarimu di area rahasia Clarissa telah mencapai ambang batas ketahanannya. Gelombang kepuasan terlarang menyapu seluruh kesadaran Clarissa; lututnya lemas seketika dan ia harus berpegangan erat pada tepi meja agar tidak jatuh terjerembap.",
        dialogue: "Clarissa: 'Emmhh... ahh... Rian, pergi... sekarang...'",
        choices: [
            { text: "Menahan tubuhnya dari bawah agar tidak jatuh", nextScene: 8 },
            { text: "Mengecup tumit dan pergelangan kakinya yang halus", nextScene: 8 }
        ]
    },
    {
        narrative: "Rian mendengus kasar, tidak menyadari gairah terlarang yang baru saja meledak diam-diam hanya satu meter di depannya. 'Oke! Aku pergi! Tapi urusan kita belum selesai, Clarissa!' ancam Rian sambil membanting pintu kamar kost hingga bergetar keras. Langkah kakinya perlahan menjauh dan melenyap di sepanjang lorong kost.",
        dialogue: "Clarissa: 'Dia... dia sudah pergi...'",
        choices: [
            { text: "Keluar dari celah dan langsung merengkuh tubuhnya yang lemas", nextScene: 9 }
        ]
    },
    {
        narrative: "Kamu keluar dari celah sempit itu dan seketika menangkap tubuh Clarissa yang hampir roboh ke lantai. Napasnya masih memburu liar, matanya penuh dengan sisa-sisa kejutan dan gairah yang membakar. Namun sebelum sempat kalian melanjutkan gelora yang tertunda, layar ponselmu yang tergeletak di lantai mendadak menyala memancarkan panggilan video. Nama yang tertera di layar membuat jantungmu berhenti berdetak: Nama Kekasihmu Sendiri yang berada di luar kota...",
        dialogue: "Ponsel: 'Memanggil Panggilan Video dari Sayang...'",
        choices: [
            { text: "BERSAMBUNG KE EPISODE 3.....", nextScene: 0 }
        ]
    }
];

let currentScene = 0;

function renderScene() {
    const scene = scenes[currentScene];
    const storyBox = document.getElementById('storyBox');
    const choiceBox = document.getElementById('choiceBox');
    const progressBar = document.getElementById('progress');

    // Update Progress
    progressBar.style.width = ((currentScene + 1) / scenes.length * 100) + '%';

    // Render Story
    storyBox.innerHTML = `
        <div class="narrative">${scene.narrative}</div>
        <div class="dialogue">
            <span class="character-name">${scene.dialogue.split(':')[0]}</span>
            ${scene.dialogue.split(':')[1]}
        </div>
    `;

    // Render Choices
    choiceBox.innerHTML = '';
    scene.choices.forEach(choice => {
        const button = document.createElement('button');
        button.className = 'choice-btn';
        button.innerText = choice.text;
        button.onclick = () => {
            currentScene = choice.nextScene;
            renderScene();
            storyBox.scrollTop = 0;
        };
        choiceBox.appendChild(button);
    });
}

// Inisialisasi Pertama
renderScene();
</script>

</body>
</html>
